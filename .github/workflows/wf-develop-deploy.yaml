# it will trigger or run when push on develop branch
name: wf-develop-deploy
on:
  push:
    branches:
      - develop
jobs:
  wf-develop-build-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: action/ckeckout@v4
      - name: Build Website
        run: |
          npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
      - name: Upload Artifacts 
        uses: actions/upload-pages-artifacts@v3
        with:
          path: "./dist"
          name: "develop-artifact"
  wf-develop-deploy-job:
    needs: wf-develop-build-job
    permissions:
      pages: write
      id-token: write
    environment: "development-envr"
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Build Artifacts on Github pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "develop-artifact"
          token: ${{github.token}}


